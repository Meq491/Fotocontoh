<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEQ - Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #252525 0%, #0b0b0b 45%, #000 100%);
    color: white;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: auto;
    padding: 35px 0 60px;
}

.logo {
    text-align: center;
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 9px;
    margin-top: 5px;
    text-shadow: 0 0 30px rgba(255,255,255,0.25);
}

.subtitle {
    text-align: center;
    color: #888;
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.gallery-title {
    margin-top: 45px;
    margin-bottom: 18px;
    font-size: 22px;
    font-weight: bold;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.photo-card {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: #151515;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

.photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
}

.photo-card:hover img {
    transform: scale(1.05);
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    background: #111;
    border-radius: 18px;
    color: #777;
}

/* FOTO BESAR */

#viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.97);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
}

#viewerImage {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 12px;
}

#closeViewer {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 30px;
    line-height: 46px;
    cursor: pointer;
}

@media (min-width: 600px) {
    .gallery {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        MEQ
    </div>

    <div class="subtitle">
        Gallery
    </div>

    <div class="gallery-title">
        📸 Foto MEQ
    </div>

    <div id="gallery" class="gallery">
        <div class="empty">
            Memuat foto...
        </div>
    </div>

</div>


<!-- FOTO BESAR -->

<div id="viewer">

    <button id="closeViewer">
        ×
    </button>

    <img id="viewerImage">

</div>


<script>

/* ==========================================
   SUPABASE
   ========================================== */

const SUPABASE_URL =
"https://vngbbgmmernxgdjzyizs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WmqF6NVq_f8IOGycOYO_CA_FaLrbXeS";

const BUCKET =
"Foto";


/* ==========================================
   ELEMENT
   ========================================== */

const gallery =
document.getElementById("gallery");

const viewer =
document.getElementById("viewer");

const viewerImage =
document.getElementById("viewerImage");

const closeViewer =
document.getElementById("closeViewer");


/* ==========================================
   LOAD GALERI
   ========================================== */

async function loadGallery() {

    try {

        const response =
        await fetch(

            SUPABASE_URL +
            "/storage/v1/object/list/" +
            BUCKET,

            {
                method: "POST",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                    "Content-Type":
                    "application/json"

                },

                body: JSON.stringify({

                    limit: 100,

                    offset: 0,

                    sortBy: {

                        column:
                        "created_at",

                        order:
                        "desc"

                    }

                })

            }

        );


        if (!response.ok) {

            throw new Error(
                "Gagal mengambil foto"
            );

        }


        const files =
        await response.json();


        gallery.innerHTML = "";


        if (!files.length) {

            gallery.innerHTML =
            '<div class="empty">Belum ada foto.</div>';

            return;

        }


        files.forEach(function(file) {

            if (!file.name) {
                return;
            }


            const imageURL =
            SUPABASE_URL +
            "/storage/v1/object/public/" +
            BUCKET +
            "/" +
            encodeURIComponent(
                file.name
            );


            const card =
            document.createElement("div");

            card.className =
            "photo-card";


            const img =
            document.createElement("img");

            img.src =
            imageURL;

            img.alt =
            "Foto MEQ";

            img.loading =
            "lazy";


            card.appendChild(img);

            gallery.appendChild(card);


            /* KLIK FOTO */

            card.addEventListener(
                "click",
                function() {

                    viewerImage.src =
                    imageURL;

                    viewer.style.display =
                    "flex";

                    document.body.style.overflow =
                    "hidden";

                }
            );

        });


    }

    catch(error) {

        console.error(error);

        gallery.innerHTML =
        '<div class="empty">Galeri belum bisa dimuat.</div>';

    }

}


/* ==========================================
   TUTUP FOTO
   ========================================== */

function closeImage() {

    viewer.style.display =
    "none";

    viewerImage.src =
    "";

    document.body.style.overflow =
    "";

}


closeViewer.addEventListener(
    "click",
    closeImage
);


/* Klik background untuk menutup */

viewer.addEventListener(
    "click",
    function(event) {

        if (
            event.target === viewer
        ) {

            closeImage();

        }

    }
);


/* Tombol ESC */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeImage();

        }

    }
);


/* ==========================================
   JALANKAN
   ========================================== */

loadGallery();

</script>

</body>
</html>
