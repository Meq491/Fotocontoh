<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEQ - Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #292929 0%, #0b0b0b 45%, #000 100%);
    color: white;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: auto;
    padding: 35px 0 60px;
}

.logo {
    text-align: center;
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 9px;
    margin-top: 5px;
    text-shadow: 0 0 30px rgba(255,255,255,0.25);
}

.subtitle {
    text-align: center;
    color: #888;
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.gallery-title {
    margin-top: 45px;
    margin-bottom: 18px;
    font-size: 22px;
    font-weight: bold;
}

.admin {
    background: #111;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 20px;
}

.admin input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #333;
    border-radius: 10px;
    background: #050505;
    color: white;
}

button {
    border: none;
    cursor: pointer;
}

.admin button {
    padding: 11px 16px;
    border-radius: 10px;
    background: white;
    color: black;
    font-weight: bold;
    margin-right: 6px;
}

#logoutBtn {
    display: none;
}

#uploadArea {
    display: none;
    margin-top: 12px;
}

#fileInput {
    margin-bottom: 10px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.photo-card {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: #151515;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

.photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
}

.photo-card:hover img {
    transform: scale(1.05);
}

.delete-btn {
    position: absolute;
    right: 8px;
    top: 8px;
    z-index: 5;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(180,0,0,0.9);
    color: white;
    font-size: 20px;
    display: none;
}

.admin-mode .delete-btn {
    display: block;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    background: #111;
    border-radius: 18px;
    color: #777;
}

/* FOTO BESAR */

#viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.97);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
}

#viewerImage {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 12px;
}

#closeViewer {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 30px;
    line-height: 46px;
    cursor: pointer;
}

@media (min-width: 600px) {
    .gallery {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">MEQ</div>

    <div class="subtitle">Gallery</div>

    <div class="gallery-title">
        📸 Foto MEQ
    </div>

    <!-- LOGIN ADMIN -->
    <div class="admin">

        <input
            type="email"
            id="email"
            placeholder="Email admin"
        >

        <input
            type="password"
            id="password"
            placeholder="Password admin"
        >

        <button id="loginBtn">
            Login Admin
        </button>

        <button id="logoutBtn">
            Logout
        </button>

        <div id="uploadArea">

            <input
                type="file"
                id="fileInput"
                accept="image/*"
            >

            <br>

            <button id="uploadBtn">
                Upload Foto
            </button>

        </div>

        <div id="status"></div>

    </div>

    <div id="gallery" class="gallery">
        <div class="empty">
            Memuat foto...
        </div>
    </div>

</div>

<!-- FOTO FULLSCREEN -->

<div id="viewer">

    <button id="closeViewer">×</button>

    <img id="viewerImage">

</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://vngbbgmmernxgdjzyizs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WmqF6NVq_f8IOGycOYO_CA_FaLrbXeS";

const BUCKET = "Foto";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENT
========================= */

const gallery =
document.getElementById("gallery");

const viewer =
document.getElementById("viewer");

const viewerImage =
document.getElementById("viewerImage");

const closeViewer =
document.getElementById("closeViewer");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const uploadArea =
document.getElementById("uploadArea");

const uploadBtn =
document.getElementById("uploadBtn");

const fileInput =
document.getElementById("fileInput");

const status =
document.getElementById("status");


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    async function() {

        status.textContent = "Login...";

        const {
            error
        } = await supabase.auth.signInWithPassword({

            email: email.value,

            password: password.value

        });

        if (error) {

            status.textContent =
            "Login gagal: " +
            error.message;

            return;
        }

        status.textContent =
        "Login berhasil.";

        email.value = "";
        password.value = "";

        updateAdmin();

    }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async function() {

        await supabase.auth.signOut();

        updateAdmin();

    }
);


/* =========================
   CEK ADMIN
========================= */

async function updateAdmin() {

    const {
        data
    } = await supabase.auth.getUser();

    if (data.user) {

        document.body.classList.add(
            "admin-mode"
        );

        loginBtn.style.display =
        "none";

        logoutBtn.style.display =
        "inline-block";

        uploadArea.style.display =
        "block";

    } else {

        document.body.classList.remove(
            "admin-mode"
        );

        loginBtn.style.display =
        "inline-block";

        logoutBtn.style.display =
        "none";

        uploadArea.style.display =
        "none";

    }

    loadGallery();

}


/* =========================
   LOAD GALLERY
========================= */

async function loadGallery() {

    gallery.innerHTML =
    '<div class="empty">Memuat foto...</div>';

    const {
        data,
        error
    } = await supabase
        .storage
        .from(BUCKET)
        .list("", {
            limit: 100,
            offset: 0,
            sortBy: {
                column: "created_at",
                order: "desc"
            }
        });

    if (error) {

        console.error(error);

        gallery.innerHTML =
        '<div class="empty">Galeri belum bisa dimuat.</div>';

        return;
    }

    gallery.innerHTML = "";

    if (!data || data.length === 0) {

        gallery.innerHTML =
        '<div class="empty">Belum ada foto.</div>';

        return;
    }


    data.forEach(function(file) {

        if (!file.name) return;


        const {
            data: publicData
        } = supabase
            .storage
            .from(BUCKET)
            .getPublicUrl(file.name);


        const imageURL =
        publicData.publicUrl;


        const card =
        document.createElement("div");

        card.className =
        "photo-card";


        const img =
        document.createElement("img");

        img.src =
        imageURL;

        img.alt =
        "Foto MEQ";

        img.loading =
        "lazy";


        const deleteBtn =
        document.createElement("button");

        deleteBtn.className =
        "delete-btn";

        deleteBtn.innerHTML =
        "×";


        deleteBtn.addEventListener(
            "click",
            async function(event) {

                event.stopPropagation();

                const yakin =
                confirm(
                    "Hapus foto ini?"
                );

                if (!yakin) return;


                const {
                    error
                } = await supabase
                    .storage
                    .from(BUCKET)
                    .remove([
                        file.name
                    ]);


                if (error) {

                    alert(
                        "Gagal menghapus: " +
                        error.message
                    );

                    return;
                }


                loadGallery();

            }
        );


        card.appendChild(img);

        card.appendChild(deleteBtn);

        gallery.appendChild(card);


        card.addEventListener(
            "click",
            function() {

                viewerImage.src =
                imageURL;

                viewer.style.display =
                "flex";

                document.body.style.overflow =
                "hidden";

            }
        );

    });

}


/* =========================
   UPLOAD
========================= */

uploadBtn.addEventListener(
    "click",
    async function() {

        const file =
        fileInput.files[0];

        if (!file) {

            alert(
                "Pilih foto terlebih dahulu."
            );

            return;
        }


        const {
            data
        } = await supabase.auth.getUser();


        if (!data.user) {

            alert(
                "Silakan login sebagai admin."
            );

            return;
        }


        status.textContent =
        "Mengupload...";


        const extension =
        file.name.split(".").pop();


        const fileName =
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 8) +
        "." +
        extension;


        const {
            error
        } = await supabase
            .storage
            .from(BUCKET)
            .upload(
                fileName,
                file,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


        if (error) {

            status.textContent =
            "Upload gagal: " +
            error.message;

            return;
        }


        status.textContent =
        "Foto berhasil diupload.";

        fileInput.value = "";

        loadGallery();

    }
);


/* =========================
   VIEWER
========================= */

function closeImage() {

    viewer.style.display =
    "none";

    viewerImage.src = "";

    document.body.style.overflow =
    "";

}


closeViewer.addEventListener(
    "click",
    closeImage
);


viewer.addEventListener(
    "click",
    function(event) {

        if (
            event.target === viewer
        ) {
            closeImage();
        }

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {
            closeImage();
        }

    }
);


/* =========================
   SESSION
========================= */

supabase.auth.onAuthStateChange(
    function() {
        updateAdmin();
    }
);


/* =========================
   START
========================= */

updateAdmin();

</script>

</body>
</html>
