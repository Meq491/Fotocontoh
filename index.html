<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #252525 0%, #090909 45%, #000 100%);
    color: white;
}

/* =========================
   LOGIN
========================= */

#loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    padding: 30px 25px;
    border-radius: 24px;
    background: rgba(18,18,18,0.88);
    border: 1px solid #292929;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.login-title {
    text-align: center;
    font-size: 25px;
    font-weight: 600;
    letter-spacing: 5px;
    margin-bottom: 30px;
    color: #ddd;
}

.login-box input {
    width: 100%;
    padding: 15px;
    margin-bottom: 13px;
    border: 1px solid #333;
    border-radius: 12px;
    background: #080808;
    color: white;
    outline: none;
    font-size: 15px;
}

.login-box input:focus {
    border-color: #777;
}

.login-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #f2f2f2;
    color: #000;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
}

#loginStatus {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-top: 13px;
}


/* =========================
   GALLERY
========================= */

#galleryPage {
    display: none;
    width: 94%;
    max-width: 650px;
    margin: auto;
    padding: 35px 0 60px;
}

.ml-title {
    text-align: center;
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 8px;
    margin-bottom: 4px;
    text-shadow: 0 0 30px rgba(255,255,255,0.22);
}

.ml-subtitle {
    text-align: center;
    color: #777;
    font-size: 11px;
    letter-spacing: 5px;
    margin-bottom: 35px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.gallery-title {
    font-size: 21px;
    font-weight: bold;
}

.logout {
    border: 1px solid #333;
    background: #111;
    color: #aaa;
    padding: 9px 13px;
    border-radius: 10px;
}


/* =========================
   TAMBAH FOTO
========================= */

.upload-box {
    background: #111;
    border: 1px solid #222;
    border-radius: 18px;
    padding: 15px;
    margin-bottom: 20px;
}

.file-label {
    display: block;
    text-align: center;
    padding: 14px;
    border: 1px dashed #444;
    border-radius: 12px;
    color: #999;
    margin-bottom: 10px;
    cursor: pointer;
}

#fileInput {
    display: none;
}

.upload-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 11px;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

#uploadStatus {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 10px;
}


/* =========================
   FOTO
========================= */

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 11px;
}

.photo-card {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 16px;
    background: #111;
    cursor: pointer;
}

.photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.delete-btn {
    position: absolute;
    right: 7px;
    top: 7px;
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 50%;
    background: rgba(170,0,0,0.9);
    color: white;
    font-size: 21px;
    z-index: 5;
    cursor: pointer;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 45px 10px;
    color: #666;
}


/* =========================
   FOTO BESAR
========================= */

#viewer {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
    background: rgba(0,0,0,0.97);
}

#viewerImage {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 12px;
}

#closeViewer {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: #222;
    color: white;
    font-size: 28px;
}


/* =========================
   HP
========================= */

@media (max-width: 430px) {

    .ml-title {
        font-size: 50px;
    }

    #galleryPage {
        width: 92%;
    }

    .gallery {
        gap: 8px;
    }
}
</style>
</head>

<body>


<!-- =========================
     HALAMAN LOGIN
========================= -->

<div id="loginPage">

    <div class="login-box">

        <div class="login-title">
            PRIVATE
        </div>

        <input
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            class="login-btn"
            id="loginBtn">
            MASUK
        </button>

        <div id="loginStatus"></div>

    </div>

</div>


<!-- =========================
     HALAMAN SETELAH LOGIN
========================= -->

<div id="galleryPage">

    <div class="ml-title">
        M&L
    </div>

    <div class="ml-subtitle">
        PRIVATE GALLERY
    </div>


    <div class="topbar">

        <div class="gallery-title">
            📸 Gallery
        </div>

        <button
            class="logout"
            id="logoutBtn">
            Logout
        </button>

    </div>


    <!-- TAMBAH FOTO -->

    <div class="upload-box">

        <label
            class="file-label"
            for="fileInput">
            ＋ Tambahkan Foto
        </label>

        <input
            type="file"
            id="fileInput"
            accept="image/*"
        >

        <button
            class="upload-btn"
            id="uploadBtn">
            UPLOAD FOTO
        </button>

        <div id="uploadStatus"></div>

    </div>


    <!-- GALERI -->

    <div
        id="gallery"
        class="gallery">

        <div class="empty">
            Memuat foto...
        </div>

    </div>

</div>


<!-- =========================
     FOTO BESAR
========================= -->

<div id="viewer">

    <button id="closeViewer">
        ×
    </button>

    <img
        id="viewerImage"
        alt="Foto">

</div>


<script type="module">

import {
    createClient
} from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://vngbbgmmernxgdjzyizs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WmqF6NVq_f8IOGycOYO_CA_FaLrbXeS";

const BUCKET =
"Foto";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENT
========================= */

const loginPage =
document.getElementById(
    "loginPage"
);

const galleryPage =
document.getElementById(
    "galleryPage"
);

const email =
document.getElementById(
    "email"
);

const password =
document.getElementById(
    "password"
);

const loginBtn =
document.getElementById(
    "loginBtn"
);

const logoutBtn =
document.getElementById(
    "logoutBtn"
);

const loginStatus =
document.getElementById(
    "loginStatus"
);

const gallery =
document.getElementById(
    "gallery"
);

const fileInput =
document.getElementById(
    "fileInput"
);

const uploadBtn =
document.getElementById(
    "uploadBtn"
);

const uploadStatus =
document.getElementById(
    "uploadStatus"
);

const viewer =
document.getElementById(
    "viewer"
);

const viewerImage =
document.getElementById(
    "viewerImage"
);

const closeViewer =
document.getElementById(
    "closeViewer"
);


/* =========================
   TAMPILAN LOGIN/GALERI
========================= */

async function checkLogin() {

    const {
        data
    } =
    await supabase.auth.getUser();


    if (data.user) {

        loginPage.style.display =
        "none";

        galleryPage.style.display =
        "block";

        loadGallery();

    } else {

        loginPage.style.display =
        "flex";

        galleryPage.style.display =
        "none";

    }
}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    async function() {

        loginStatus.textContent =
        "Memeriksa...";


        const {
            error
        } =
        await supabase.auth
        .signInWithPassword({

            email:
            email.value.trim(),

            password:
            password.value

        });


        if (error) {

            loginStatus.textContent =
            "Login gagal.";

            return;
        }


        loginStatus.textContent =
        "";

        email.value = "";

        password.value = "";

        checkLogin();

    }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async function() {

        await supabase.auth.signOut();

        checkLogin();

    }
);


/* =========================
   LOAD FOTO
========================= */

async function loadGallery() {

    gallery.innerHTML =
    '<div class="empty">Memuat foto...</div>';


    const {
        data,
        error
    } =
    await supabase
    .storage
    .from(BUCKET)
    .list("", {

        limit: 100,

        offset: 0,

        sortBy: {
            column: "created_at",
            order: "desc"
        }

    });


    if (error) {

        console.error(error);

        gallery.innerHTML =
        '<div class="empty">Gagal memuat foto.</div>';

        return;
    }


    gallery.innerHTML = "";


    if (!data || data.length === 0) {

        gallery.innerHTML =
        '<div class="empty">Belum ada foto.</div>';

        return;
    }


    data.forEach(
        function(file) {

            if (!file.name)
                return;


            const {
                data: publicData
            } =
            supabase
            .storage
            .from(BUCKET)
            .getPublicUrl(
                file.name
            );


            const imageURL =
            publicData.publicUrl;


            const card =
            document.createElement(
                "div"
            );

            card.className =
            "photo-card";


            const img =
            document.createElement(
                "img"
            );

            img.src =
            imageURL;

            img.alt =
            "Foto";


            /* HAPUS */

            const deleteBtn =
            document.createElement(
                "button"
            );

            deleteBtn.className =
            "delete-btn";

            deleteBtn.innerHTML =
            "×";


            deleteBtn.addEventListener(
                "click",
                async function(event) {

                    event.stopPropagation();


                    if (
                        !confirm(
                            "Hapus foto ini?"
                        )
                    ) {
                        return;
                    }


                    const {
                        error
                    } =
                    await supabase
                    .storage
                    .from(BUCKET)
                    .remove([
                        file.name
                    ]);


                    if (error) {

                        alert(
                            "Gagal menghapus foto."
                        );

                        return;
                    }


                    loadGallery();

                }
            );


            card.appendChild(img);

            card.appendChild(
                deleteBtn
            );

            gallery.appendChild(card);


            /* FOTO BESAR */

            card.addEventListener(
                "click",
                function() {

                    viewerImage.src =
                    imageURL;

                    viewer.style.display =
                    "flex";

                    document.body.style.overflow =
                    "hidden";

                }
            );

        }
    );
}


/* =========================
   UPLOAD
========================= */

uploadBtn.addEventListener(
    "click",
    async function() {

        const file =
        fileInput.files[0];


        if (!file) {

            uploadStatus.textContent =
            "Pilih foto dulu.";

            return;
        }


        uploadStatus.textContent =
        "Mengupload...";


        const {
            data
        } =
        await supabase.auth.getUser();


        if (!data.user) {

            uploadStatus.textContent =
            "Silakan login.";

            return;
        }


        const extension =
        file.name
        .split(".")
        .pop();


        const fileName =
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2,8) +
        "." +
        extension;


        const {
            error
        } =
        await supabase
        .storage
        .from(BUCKET)
        .upload(
            fileName,
            file,
            {
                cacheControl: "3600",
                upsert: false
            }
        );


        if (error) {

            uploadStatus.textContent =
            "Upload gagal.";

            console.error(error);

            return;
        }


        uploadStatus.textContent =
        "Foto berhasil ditambahkan.";

        fileInput.value = "";

        loadGallery();

    }
);


/* =========================
   FOTO BESAR
========================= */

function closeImage() {

    viewer.style.display =
    "none";

    viewerImage.src = "";

    document.body.style.overflow =
    "";

}


closeViewer.addEventListener(
    "click",
    closeImage
);


viewer.addEventListener(
    "click",
    function(event) {

        if (
            event.target === viewer
        ) {

            closeImage();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeImage();

        }

    }
);


/* =========================
   AUTH CHANGE
========================= */

supabase.auth.onAuthStateChange(
    function() {

        checkLogin();

    }
);


/* =========================
   MULAI
========================= */

checkLogin();

</script>

</body>
</html>
