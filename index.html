<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&L</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:370px;
  background:#111;
  padding:28px 24px;
  border:1px solid #292929;
  border-radius:20px;
}

.loginTitle{
  text-align:center;
  font-size:24px;
  font-weight:900;
  letter-spacing:6px;
  margin-bottom:28px;
}

.loginBox input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  background:#050505;
  color:white;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.loginButton{
  width:100%;
  padding:15px;
  background:white;
  color:black;
  border:0;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.loginButton:disabled{
  opacity:.5;
}

#loginStatus{
  text-align:center;
  margin-top:12px;
  color:#aaa;
  font-size:13px;
}


/* GALERI */

#galleryPage{
  display:none;
  width:92%;
  max-width:650px;
  margin:auto;
  padding:30px 0 60px;
}

.mlTitle{
  text-align:center;
  font-size:55px;
  font-weight:900;
  letter-spacing:8px;
}

.privateText{
  text-align:center;
  color:#777;
  font-size:10px;
  letter-spacing:5px;
  margin-top:3px;
}

.galleryName{
  text-align:center;
  font-size:25px;
  font-weight:bold;
  margin:25px 0;
}

.topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.galleryLabel{
  font-size:20px;
  font-weight:bold;
}

.logoutButton{
  padding:9px 14px;
  border-radius:9px;
  border:1px solid #333;
  background:#111;
  color:#aaa;
}


/* ADMIN */

#adminPanel{
  display:none;
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  padding:16px;
  margin-bottom:22px;
}

.adminLabel{
  color:#aaa;
  font-size:13px;
  margin-bottom:8px;
}

#descriptionInput{
  width:100%;
  min-height:80px;
  padding:13px;
  background:#050505;
  color:white;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
  resize:vertical;
  margin-bottom:10px;
}

.fileLabel{
  display:block;
  padding:13px;
  text-align:center;
  border:1px dashed #444;
  border-radius:10px;
  color:#aaa;
  cursor:pointer;
  margin-bottom:10px;
}

#fileInput{
  display:none;
}

.uploadButton{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:white;
  color:black;
  font-weight:bold;
}

#uploadStatus{
  text-align:center;
  margin-top:9px;
  color:#aaa;
  font-size:12px;
}


/* FOTO */

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.photoItem{
  min-width:0;
}

.photoBox{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:15px;
  background:#111;
  cursor:pointer;
}

.photoBox img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photoDescription{
  margin-top:9px;
  padding:0 3px;
  font-size:15px;
  font-weight:600;
  line-height:1.4;
}

.moreButton{
  position:absolute;
  top:8px;
  right:8px;
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:22px;
  z-index:5;
}

.photoMenu{
  display:none;
  position:absolute;
  top:48px;
  right:8px;
  background:#181818;
  border:1px solid #333;
  border-radius:10px;
  overflow:hidden;
  z-index:10;
}

.photoMenu button{
  padding:12px 18px;
  background:#181818;
  color:white;
  border:0;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:#666;
  padding:40px 10px;
}


/* FOTO BESAR */

#viewer{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.97);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:15px;
}

#viewerImage{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
  border-radius:10px;
}

#closeViewer{
  position:absolute;
  top:15px;
  right:15px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:28px;
}


/* HP */

@media(max-width:430px){

  .mlTitle{
    font-size:48px;
  }

  .galleryName{
    font-size:22px;
  }

  .photoDescription{
    font-size:14px;
  }

}
</style>
</head>

<body>


<!-- LOGIN -->

<div id="loginPage">

  <div class="loginBox">

    <div class="loginTitle">
      PRIVATE
    </div>

    <input
      id="emailInput"
      type="email"
      placeholder="Email"
    >

    <input
      id="passwordInput"
      type="password"
      placeholder="Password"
    >

    <button
      id="loginButton"
      type="button"
      class="loginButton">
      MASUK
    </button>

    <div id="loginStatus"></div>

  </div>

</div>


<!-- GALERI -->

<div id="galleryPage">

  <div class="mlTitle">
    M&L
  </div>

  <div class="privateText">
    PRIVATE GALLERY
  </div>

  <div class="galleryName">
    M&L
  </div>

  <div class="topBar">

    <div class="galleryLabel">
      Gallery
    </div>

    <button
      id="logoutButton"
      type="button"
      class="logoutButton">
      Logout
    </button>

  </div>


  <!-- ADMIN -->

  <div id="adminPanel">

    <div class="adminLabel">
      Keterangan Foto
    </div>

    <textarea
      id="descriptionInput"
      placeholder="Tulis keterangan foto..."
    ></textarea>

    <label
      class="fileLabel"
      for="fileInput">
      + PILIH FOTO
    </label>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
    >

    <button
      id="uploadButton"
      type="button"
      class="uploadButton">
      UPLOAD FOTO
    </button>

    <div id="uploadStatus"></div>

  </div>


  <div
    id="gallery"
    class="gallery">

    <div class="empty">
      Memuat foto...
    </div>

  </div>

</div>


<!-- VIEWER -->

<div id="viewer">

  <button
    id="closeViewer"
    type="button">
    ×
  </button>

  <img
    id="viewerImage"
    alt="Foto">

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://vngbbgmmernxgdjzyizs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WmqF6NVq_f8IOGycOYO_CA_FaLrbXeS";

const BUCKET =
"Foto";

const ADMIN_UID =
"68fb3fcd-dcf1-4176-8340-7f6fa8f90dce";


const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ELEMENT
========================= */

const loginPage =
document.getElementById("loginPage");

const galleryPage =
document.getElementById("galleryPage");

const emailInput =
document.getElementById("emailInput");

const passwordInput =
document.getElementById("passwordInput");

const loginButton =
document.getElementById("loginButton");

const loginStatus =
document.getElementById("loginStatus");

const logoutButton =
document.getElementById("logoutButton");

const adminPanel =
document.getElementById("adminPanel");

const descriptionInput =
document.getElementById("descriptionInput");

const fileInput =
document.getElementById("fileInput");

const uploadButton =
document.getElementById("uploadButton");

const uploadStatus =
document.getElementById("uploadStatus");

const gallery =
document.getElementById("gallery");

const viewer =
document.getElementById("viewer");

const viewerImage =
document.getElementById("viewerImage");

const closeViewer =
document.getElementById("closeViewer");


/* =========================
   LOGIN
========================= */

loginButton.addEventListener(
  "click",
  async function(){

    const email =
    emailInput.value.trim();

    const password =
    passwordInput.value;

    if(!email){

      loginStatus.textContent =
      "Masukkan email.";

      return;
    }

    if(!password){

      loginStatus.textContent =
      "Masukkan password.";

      return;
    }

    loginStatus.textContent =
    "Sedang masuk...";

    loginButton.disabled =
    true;


    const result =
    await supabase.auth.signInWithPassword({

      email:email,

      password:password

    });


    loginButton.disabled =
    false;


    if(result.error){

      console.error(
        result.error
      );

      loginStatus.textContent =
      "Login gagal: " +
      result.error.message;

      return;
    }


    loginStatus.textContent =
    "";

    tampilkanGallery(
      result.data.user
    );

  }
);


/* ENTER UNTUK LOGIN */

passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      loginButton.click();

    }

  }
);


/* =========================
   TAMPILKAN GALERI
========================= */

async function tampilkanGallery(user){

  loginPage.style.display =
  "none";

  galleryPage.style.display =
  "block";


  const isAdmin =
  user.id === ADMIN_UID;


  if(isAdmin){

    adminPanel.style.display =
    "block";

  }else{

    adminPanel.style.display =
    "none";

  }


  loadPhotos(isAdmin);

}


/* =========================
   CEK LOGIN SAAT HALAMAN DIBUKA
========================= */

async function cekSession(){

  const result =
  await supabase.auth.getUser();

  if(result.data.user){

    tampilkanGallery(
      result.data.user
    );

  }else{

    loginPage.style.display =
    "flex";

    galleryPage.style.display =
    "none";

  }

}


/* =========================
   LOGOUT
========================= */

logoutButton.addEventListener(
  "click",
  async function(){

    await supabase.auth.signOut();

    galleryPage.style.display =
    "none";

    loginPage.style.display =
    "flex";

  }
);


/* =========================
   LOAD FOTO
========================= */

async function loadPhotos(isAdmin){

  gallery.innerHTML =
  '<div class="empty">Memuat foto...</div>';


  const result =
  await supabase
  .from("gallery_photos")
  .select(
    "id,file_name,title,description,created_at"
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(result.error){

    console.error(
      result.error
    );

    gallery.innerHTML =
    '<div class="empty">Gagal memuat data foto.</div>';

    return;
  }


  gallery.innerHTML =
  "";


  if(!result.data.length){

    gallery.innerHTML =
    '<div class="empty">Belum ada foto.</div>';

    return;
  }


  result.data.forEach(
    function(record){

      const publicResult =
      supabase.storage
      .from(BUCKET)
      .getPublicUrl(
        record.file_name
      );


      const imageUrl =
      publicResult.data.publicUrl;


      const item =
      document.createElement("div");

      item.className =
      "photoItem";


      const box =
      document.createElement("div");

      box.className =
      "photoBox";


      const img =
      document.createElement("img");

      img.src =
      imageUrl;

      img.alt =
      "Foto";


      box.appendChild(img);


      /* MENU ADMIN */

      if(isAdmin){

        const more =
        document.createElement("button");

        more.type =
        "button";

        more.className =
        "moreButton";

        more.textContent =
        "⋮";


        const menu =
        document.createElement("div");

        menu.className =
        "photoMenu";


        const deleteButton =
        document.createElement("button");

        deleteButton.type =
        "button";

        deleteButton.textContent =
        "Hapus";


        deleteButton.addEventListener(
          "click",
          async function(event){

            event.stopPropagation();


            if(
              !confirm(
                "Hapus foto ini?"
              )
            ){

              return;

            }


            const storageResult =
            await supabase.storage
            .from(BUCKET)
            .remove([
              record.file_name
            ]);


            if(storageResult.error){

              alert(
                "Gagal menghapus file."
              );

              return;
            }


            const databaseResult =
            await supabase
            .from("gallery_photos")
            .delete()
            .eq(
              "id",
              record.id
            );


            if(databaseResult.error){

              alert(
                "Gagal menghapus data."
              );

              return;
            }


            loadPhotos(true);

          }
        );


        menu.appendChild(
          deleteButton
        );


        more.addEventListener(
          "click",
          function(event){

            event.stopPropagation();

            if(
              menu.style.display ===
              "block"
            ){

              menu.style.display =
              "none";

            }else{

              menu.style.display =
              "block";

            }

          }
        );


        box.appendChild(more);
        box.appendChild(menu);

      }


      /* FOTO BESAR */

      box.addEventListener(
        "click",
        function(){

          viewerImage.src =
          imageUrl;

          viewer.style.display =
          "flex";

        }
      );


      item.appendChild(box);


      /* KETERANGAN */

      if(record.description){

        const description =
        document.createElement("div");

        description.className =
        "photoDescription";

        description.textContent =
        record.description;

        item.appendChild(
          description
        );

      }


      gallery.appendChild(
        item
      );

    }
  );

}


/* =========================
   UPLOAD FOTO
========================= */

uploadButton.addEventListener(
  "click",
  async function(){

    const session =
    await supabase.auth.getUser();

    const user =
    session.data.user;


    if(
      !user ||
      user.id !== ADMIN_UID
    ){

      uploadStatus.textContent =
      "Akses ditolak.";

      return;
    }


    const file =
    fileInput.files[0];

    const description =
    descriptionInput.value.trim();


    if(!file){

      uploadStatus.textContent =
      "Pilih foto terlebih dahulu.";

      return;
    }


    uploadStatus.textContent =
    "Mengupload...";

    uploadButton.disabled =
    true;


    const extension =
    file.name
    .split(".")
    .pop()
    .toLowerCase();


    const fileName =
    Date.now() +
    "_" +
    Math.random()
    .toString(36)
    .substring(2,9) +
    "." +
    extension;


    /* STORAGE */

    const storageResult =
    await supabase.storage
    .from(BUCKET)
    .upload(
      fileName,
      file,
      {
        cacheControl:"3600",
        upsert:false
      }
    );


    if(storageResult.error){

      console.error(
        storageResult.error
      );

      uploadStatus.textContent =
      "Gagal upload foto.";

      uploadButton.disabled =
      false;

      return;
    }


    /* DATABASE */

    const databaseResult =
    await supabase
    .from("gallery_photos")
    .insert({

      file_name:
      fileName,

      title:
      "Foto",

      description:
      description

    });


    if(databaseResult.error){

      console.error(
        databaseResult.error
      );


      await supabase.storage
      .from(BUCKET)
      .
