<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&L</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#292929 0%,#090909 45%,#000 100%);
  color:#fff;
  font-family:Arial,sans-serif;
}

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:370px;
  padding:28px 24px;
  background:#111;
  border:1px solid #292929;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.65);
}

.loginTitle{
  text-align:center;
  font-size:23px;
  letter-spacing:6px;
  margin-bottom:28px;
}

.loginBox input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border:1px solid #333;
  border-radius:11px;
  background:#050505;
  color:#fff;
  outline:none;
  font-size:15px;
}

.loginButton{
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#f5f5f5;
  color:#000;
  font-weight:bold;
  letter-spacing:2px;
}

#loginStatus{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-top:12px;
}

#galleryPage{
  display:none;
  width:92%;
  max-width:650px;
  margin:auto;
  padding:32px 0 60px;
}

.mlTitle{
  text-align:center;
  font-size:55px;
  font-weight:900;
  letter-spacing:8px;
}

.privateText{
  text-align:center;
  color:#777;
  font-size:10px;
  letter-spacing:5px;
  margin-top:4px;
}

.galleryName{
  text-align:center;
  margin:22px 0 25px;
  font-size:25px;
  font-weight:700;
}

.galleryNameEdit{
  display:none;
  margin-bottom:20px;
}

.galleryNameEdit input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#050505;
  color:#fff;
  outline:none;
}

.galleryNameEdit button{
  margin-top:8px;
  width:100%;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-weight:bold;
}

.topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.galleryLabel{
  font-size:20px;
  font-weight:700;
}

.logoutButton{
  padding:9px 13px;
  border-radius:10px;
  border:1px solid #333;
  background:#111;
  color:#aaa;
}

#adminPanel{
  display:none;
  background:#111;
  border:1px solid #292929;
  border-radius:17px;
  padding:16px;
  margin-bottom:22px;
}

.adminLabel{
  color:#aaa;
  font-size:13px;
  margin-bottom:7px;
}

#descriptionInput{
  width:100%;
  min-height:80px;
  padding:13px;
  margin-bottom:10px;
  border-radius:11px;
  border:1px solid #333;
  background:#050505;
  color:#fff;
  outline:none;
  resize:vertical;
  font-family:Arial,sans-serif;
}

.fileLabel{
  display:block;
  text-align:center;
  padding:13px;
  border:1px dashed #444;
  border-radius:11px;
  color:#aaa;
  margin-bottom:10px;
}

#fileInput{
  display:none;
}

.uploadButton,
.editNameButton{
  width:100%;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-weight:bold;
}

.editNameButton{
  margin-top:10px;
  background:#222;
  color:#fff;
  border:1px solid #333;
}

#uploadStatus{
  text-align:center;
  color:#aaa;
  font-size:12px;
  margin-top:9px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.photoItem{
  min-width:0;
}

.photoBox{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#111;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}

.photoBox img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photoDescription{
  margin-top:9px;
  padding:0 3px;
  font-size:15px;
  font-weight:600;
  line-height:1.4;
  color:#eee;
}

.moreButton{
  position:absolute;
  top:8px;
  right:8px;
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff;
  font-size:22px;
  z-index:5;
}

.photoMenu{
  position:absolute;
  top:48px;
  right:8px;
  display:none;
  min-width:110px;
  background:#181818;
  border:1px solid #333;
  border-radius:11px;
  overflow:hidden;
  z-index:20;
}

.photoMenu button{
  width:100%;
  padding:12px 15px;
  border:0;
  background:transparent;
  color:#fff;
  text-align:left;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:45px 10px;
  color:#666;
}

#viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.97);
}

#viewerImage{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
  border-radius:12px;
}

#closeViewer{
  position:absolute;
  right:15px;
  top:15px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:28px;
}

@media(max-width:430px){
  #galleryPage{width:92%}
  .mlTitle{font-size:49px}
  .galleryName{font-size:22px}
  .photoDescription{font-size:14px}
}
</style>
</head>

<body>

<div id="loginPage">
  <div class="loginBox">

    <div class="loginTitle">PRIVATE</div>

    <input id="emailInput" type="email" placeholder="Email">

    <input id="passwordInput" type="password" placeholder="Password">

    <button id="loginButton" class="loginButton">
      MASUK
    </button>

    <div id="loginStatus"></div>

  </div>
</div>


<div id="galleryPage">

  <div class="mlTitle">M&L</div>

  <div class="privateText">
    PRIVATE GALLERY
  </div>

  <div id="galleryName" class="galleryName">
    M&L
  </div>

  <div id="galleryNameEdit" class="galleryNameEdit">

    <input
      id="galleryNameInput"
      type="text"
      placeholder="Nama galeri">

    <button id="saveGalleryName">
      SIMPAN NAMA
    </button>

  </div>


  <div class="topBar">

    <div class="galleryLabel">
      Gallery
    </div>

    <button id="logoutButton" class="logoutButton">
      Logout
    </button>

  </div>


  <div id="adminPanel">

    <div class="adminLabel">
      Keterangan Foto
    </div>

    <textarea
      id="descriptionInput"
      placeholder="Contoh: Kenangan bersama keluarga..."
    ></textarea>

    <label class="fileLabel" for="fileInput">
      + PILIH FOTO
    </label>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
    >

    <button id="uploadButton" class="uploadButton">
      UPLOAD FOTO
    </button>

    <button id="editNameButton" class="editNameButton">
      UBAH NAMA GALERI
    </button>

    <div id="uploadStatus"></div>

  </div>


  <div id="gallery" class="gallery">
    <div class="empty">
      Memuat foto...
    </div>
  </div>

</div>


<div id="viewer">

  <button id="closeViewer">
    ×
  </button>

  <img id="viewerImage" alt="Foto">

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://vngbbgmmernxgdjzyizs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WmqF6NVq_f8IOGycOYO_CA_FaLrbXeS";

const BUCKET = "Foto";

const ADMIN_UID =
"68fb3fcd-dcf1-4176-8340-7f6fa8f90dce";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const loginPage =
document.getElementById("loginPage");

const galleryPage =
document.getElementById("galleryPage");

const loginButton =
document.getElementById("loginButton");

const emailInput =
document.getElementById("emailInput");

const passwordInput =
document.getElementById("passwordInput");

const loginStatus =
document.getElementById("loginStatus");

const logoutButton =
document.getElementById("logoutButton");

const adminPanel =
document.getElementById("adminPanel");

const descriptionInput =
document.getElementById("descriptionInput");

const fileInput =
document.getElementById("fileInput");

const uploadButton =
document.getElementById("uploadButton");

const editNameButton =
document.getElementById("editNameButton");

const uploadStatus =
document.getElementById("uploadStatus");

const gallery =
document.getElementById("gallery");

const galleryName =
document.getElementById("galleryName");

const galleryNameEdit =
document.getElementById("galleryNameEdit");

const galleryNameInput =
document.getElementById("galleryNameInput");

const saveGalleryName =
document.getElementById("saveGalleryName");

const viewer =
document.getElementById("viewer");

const viewerImage =
document.getElementById("viewerImage");

const closeViewer =
document.getElementById("closeViewer");


async function checkLogin(){

  const {
    data
  } =
  await supabase.auth.getUser();

  if(!data.user){

    loginPage.style.display="flex";
    galleryPage.style.display="none";

    return;
  }

  loginPage.style.display="none";
  galleryPage.style.display="block";

  const isAdmin =
  data.user.id === ADMIN_UID;

  adminPanel.style.display =
  isAdmin ? "block" : "none";

  await loadGalleryName();
  await loadPhotos(isAdmin);
}


loginButton.addEventListener(
  "click",
  async()=>{

    loginStatus.textContent="Memeriksa...";

    const {
      error
    } =
    await supabase.auth
    .signInWithPassword({

      email:
      emailInput.value.trim(),

      password:
      passwordInput.value

    });

    if(error){

      console.error(error);

      loginStatus.textContent =
      error.message;

      return;
    }

    emailInput.value="";
    passwordInput.value="";
    loginStatus.textContent="";

    checkLogin();

  }
);


logoutButton.addEventListener(
  "click",
  async()=>{

    await supabase.auth.signOut();

    checkLogin();

  }
);


async function loadGalleryName(){

  const {
    data,
    error
  } =
  await supabase
  .from("gallery_settings")
  .select("gallery_name")
  .eq("id",1)
  .maybeSingle();

  if(error){

    console.error(error);

    return;
  }

  if(data){

    galleryName.textContent =
    data.gallery_name;

    galleryNameInput.value =
    data.gallery_name;
  }
}


editNameButton.addEventListener(
  "click",
  ()=>{

    galleryNameEdit.style.display =
    galleryNameEdit.style.display ===
    "block"
    ? "none"
    : "block";

  }
);


saveGalleryName.addEventListener(
  "click",
  async()=>{

    const {
      data
    } =
    await supabase.auth.getUser();

    if(
      !data.user ||
      data.user.id !== ADMIN_UID
    ){

      return;
    }

    const newName =
    galleryNameInput.value.trim();

    if(!newName){

      alert(
        "Nama galeri tidak boleh kosong."
      );

      return;
    }

    const {
      error
    } =
    await supabase
    .from("gallery_settings")
    .update({
      gallery_name:newName
    })
    .eq("id",1);

    if(error){

      console.error(error);

      alert(
        "Gagal mengubah nama galeri:\n"+
        error.message
      );

      return;
    }

    galleryName.textContent =
    newName;

    galleryNameEdit.style.display =
    "none";
  }
);


async function loadPhotos(isAdmin){

  gallery.innerHTML =
  '<div class="empty">Memuat foto...</div>';

  const {
    data,
    error
  } =
  await supabase
  .from("gallery_photos")
  .select(
    "id,file_name,title,description,created_at"
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );

  if(error){

    console.error(error);

    gallery.innerHTML =
    '<div class="empty">Gagal memuat foto.</div>';

    return;
  }

  gallery.innerHTML="";

  if(!data || data.length===0){

    gallery.innerHTML =
    '<div class="empty">Belum ada foto.</div>';

    return;
  }


  data.forEach(record=>{

    const {
      data:publicData
    } =
    supabase
    .storage
    .from(BUCKET)
    .getPublicUrl(
      record.file_name
    );

    const imageUrl =
    publicData.publicUrl;


    const item =
    document.createElement("div");

    item.className="photoItem";


    const photoBox =
    document.createElement("div");

    photoBox.className="photoBox";


    const image =
    document.createElement("img");

    image.src=imageUrl;
    image.alt="Foto";


    photoBox.appendChild(image);


    if(isAdmin){

      const more =
      document.createElement("button");

      more.className="moreButton";
      more.textContent="⋮";


      const menu =
      document.createElement("div");

      menu.className="photoMenu";


      const deleteButton =
      document.createElement("button");

      deleteButton.textContent="Hapus";


      deleteButton.addEventListener(
        "click",
        async event=>{

          event.stopPropagation();

          if(
            !confirm("Hapus foto ini?")
          ){

            return;
          }


          const {
            error:storageError
          } =
          await supabase
          .storage
          .from(BUCKET)
          .remove([
            record.file_name
          ]);


          if(storageError){

            alert(
              "Gagal menghapus foto:\n"+
              storageError.message
            );

            return;
          }


          const {
            error:databaseError
          } =
          await supabase
          .from("gallery_photos")
          .delete()
          .eq("id",record.id);


          if(databaseError){

            alert(
              "Gagal menghapus data:\n"+
              databaseError.message
            );

            return;
          }


          loadPhotos(true);

        }
      );


      menu.appendChild(deleteButton);


      more.addEventListener(
        "click",
        event=>{

          event.stopPropagation();

          menu.style.display =
          menu.style.display==="block"
          ? "none"
          : "block";

        }
      );


      photoBox.appendChild(more);
      photoBox.appendChild(menu);

    }


    photoBox.addEventListener(
      "click",
      ()=>{

        viewerImage.src=imageUrl;

        viewer.style.display="flex";

        document.body.style.overflow="hidden";

      }
    );


    const description =
    document.createElement("div");

    description.className=
    "photoDescription";

    description.textContent=
    record.description || "";


    item.appendChild(photoBox);


    if(record.description){

      item.appendChild(description);

    }


    gallery.appendChild(item);

  });

}


/* ================= UPLOAD ================= */

uploadButton.addEventListener(
  "click",
  async()=>{

    const {
      data:userData
    } =
    await supabase.auth.getUser();


    if(
      !userData.user ||
      userData.user.id !== ADMIN_UID
    ){

      uploadStatus.textContent=
      "Akses ditolak.";

      return;
    }


    const file =
    fileInput.files[0];

    const description =
    descriptionInput.value.trim();


    if(!file){

      uploadStatus.textContent=
      "Pilih foto terlebih dahulu.";

      return;
    }


    uploadStatus.textContent=
    "Mengupload...";


    const extension =
    file.name
    .split(".")
    .pop()
    .toLowerCase();


    const fileName =
    Date.now()+
    "_" +
    Math.random()
    .toString(36)
    .substring(2,9)+
    "."+
    extension;


    const {
      error:uploadError
    } =
    await supabase
    .storage
    .from(BUCKET)
    .upload(
      fileName,
      file,
      {
        cacheControl:"3600",
        upsert:false
      }
    );


    if(uploadError){

      console.error(
        "STORAGE ERROR:",
        uploadError
      );

      alert(
        "Gagal upload foto:\n\n"+
        uploadError.message
      );

      uploadStatus.textContent=
      uploadError.message;

      return;
    }


    /* SIMPAN DATA FOTO */

    const {
      error:databaseError
    } =
    await supabase
    .from("gallery_photos")
    .insert({

      file_name:fileName,

      title:"Foto",

      description:description

    });


    if(databaseError){

      console.error(
        "DATABASE ERROR:",
        databaseError
      );

      alert(
        "Foto sudah masuk Storage,\n"+
        "tetapi data foto gagal disimpan.\n\n"+
        "ERROR:\n"+
        databaseError.message
      );

      uploadStatus.textContent=
      databaseError.message;

      return;
    }


    uploadStatus.textContent=
    "Foto berhasil ditambahkan.";

    descriptionInput.value="";
    fileInput.value="";

    loadPhotos(true);

  }
);


function closePhoto(){

  viewer.style.display="none";

  viewerImage.src="";

  document.body.style.overflow="";

}


closeViewer.addEventListener(
  "click",
  closePhoto
);


viewer.addEventListener(
  "click",
  event=>{

    if(event.target===viewer){

      closePhoto();

    }

  }
);


document.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Escape"){

      closePhoto();

    }

  }
);


supabase.auth.onAuthStateChange(
  ()=>{
    checkLogin();
  }
);


checkLogin();

</script>

</body>
</html>
