<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEQ491 - Upload Foto</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

.container {
    width: 92%;
    max-width: 600px;
    margin: auto;
    padding: 35px 0;
}

h1 {
    text-align: center;
    font-size: 38px;
    margin: 0;
}

p {
    text-align: center;
    color: #aaa;
}

.upload-box {
    margin-top: 30px;
    padding: 25px;
    border-radius: 20px;
    background: #151515;
    text-align: center;
}

input {
    display: none;
}

label {
    display: inline-block;
    padding: 14px 25px;
    background: white;
    color: black;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

#foto {
    width: 100%;
    margin-top: 25px;
    border-radius: 15px;
    display: none;
}

.status {
    margin-top: 15px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="container">

    <h1>MEQ491</h1>

    <p>Upload Foto</p>

    <div class="upload-box">

        <label for="pilihFoto">
            📷 Pilih Foto
        </label>

        <input
            type="file"
            id="pilihFoto"
            accept="image/*"
        >

        <img id="foto">

        <div class="status" id="status">
            Belum ada foto dipilih
        </div>

    </div>

</div>

<script>

const input = document.getElementById("pilihFoto");
const foto = document.getElementById("foto");
const status = document.getElementById("status");

input.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        foto.src = e.target.result;
        foto.style.display = "block";

        status.textContent =
            "✅ Foto berhasil ditampilkan";

    };

    reader.readAsDataURL(file);

});

</script>

</body>
</html>
