<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEQ491 - Foto</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

.container {
    width: 92%;
    max-width: 600px;
    margin: auto;
    padding: 35px 0;
}

.logo {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 3px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-top: 5px;
}

.upload-box {
    margin-top: 30px;
    padding: 25px;
    background: #151515;
    border-radius: 20px;
    text-align: center;
}

input {
    display: none;
}

.upload-button {
    display: inline-block;
    padding: 14px 25px;
    background: white;
    color: black;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

#preview {
    width: 100%;
    margin-top: 20px;
    border-radius: 15px;
    display: none;
}

.status {
    margin-top: 15px;
    color: #aaa;
}

.hapus {
    margin-top: 15px;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #d00000;
    color: white;
    font-weight: bold;
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">MEQ491</div>

    <div class="subtitle">
        Penyimpanan Foto
    </div>

    <div class="upload-box">

        <label for="fileInput" class="upload-button">
            📷 Pilih Foto
        </label>

        <input
            type="file"
            id="fileInput"
            accept="image/*"
        >

        <img id="preview">

        <div id="status" class="status">
            Memuat foto...
        </div>

        <button id="hapus" class="hapus">
            🗑 Hapus Foto
        </button>

    </div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const hapus = document.getElementById("hapus");


// MEMUAT FOTO YANG TERSIMPAN
const fotoTersimpan = localStorage.getItem("fotoMEQ491");

if (fotoTersimpan) {

    preview.src = fotoTersimpan;
    preview.style.display = "block";

    status.textContent = "✅ Foto tersimpan";

    hapus.style.display = "inline-block";

} else {

    status.textContent = "Belum ada foto";

}


// PILIH FOTO
fileInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {

        status.textContent =
            "File harus berupa foto.";

        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

        const foto = event.target.result;

        // SIMPAN FOTO
        localStorage.setItem(
            "fotoMEQ491",
            foto
        );

        // TAMPILKAN FOTO
        preview.src = foto;

        preview.style.display = "block";

        status.textContent =
            "✅ Foto berhasil disimpan";

        hapus.style.display =
            "inline-block";

    };

    reader.readAsDataURL(file);

});


// HAPUS FOTO
hapus.addEventListener("click", function() {

    localStorage.removeItem("fotoMEQ491");

    preview.src = "";

    preview.style.display = "none";

    hapus.style.display = "none";

    status.textContent =
        "Foto sudah dihapus";

});

</script>

</body>
</html>
