<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #292929 0%, #080808 45%, #000 100%);
    color: white;
}

/* =========================
   LOGIN
========================= */

#loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    padding: 30px 24px;
    border-radius: 24px;
    background: rgba(18,18,18,.9);
    border: 1px solid #292929;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
}

.login-title {
    text-align: center;
    font-size: 24px;
    letter-spacing: 5px;
    margin-bottom: 28px;
    color: #ddd;
}

.login-box input {
    width: 100%;
    padding: 15px;
    margin-bottom: 12px;
    border: 1px solid #333;
    border-radius: 12px;
    background: #050505;
    color: white;
    font-size: 15px;
    outline: none;
}

.login-btn {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: white;
    color: black;
    font-weight: bold;
    letter-spacing: 2px;
}

#loginStatus {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-top: 12px;
}


/* =========================
   GALLERY
========================= */

#galleryPage {
    display: none;
    width: 92%;
    max-width: 650px;
    margin: auto;
    padding: 32px 0 60px;
}

.ml-title {
    text-align: center;
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 8px;
    text-shadow: 0 0 30px rgba(255,255,255,.2);
}

.ml-subtitle {
    text-align: center;
    color: #777;
    font-size: 11px;
    letter-spacing: 5px;
    margin-top: 5px;
    margin-bottom: 32px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.gallery-title {
    font-size: 21px;
    font-weight: bold;
}

.logout {
    background: #111;
    border: 1px solid #333;
    color: #aaa;
    padding: 9px 13px;
    border-radius: 10px;
}


/* =========================
   ADMIN UPLOAD
========================= */

#adminPanel {
    display: none;
    background: #111;
    border: 1px solid #222;
    padding: 15px;
    border-radius: 18px;
    margin-bottom: 20px;
}

.file-label {
    display: block;
    text-align: center;
    padding: 14px;
    border: 1px dashed #444;
    border-radius: 12px;
    color: #aaa;
    margin-bottom: 10px;
}

#fileInput {
    display: none;
}

.upload-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 11px;
    background: white;
    color: black;
    font-weight: bold;
}

#uploadStatus {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 10px;
}


/* =========================
   GALERI
========================= */

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.photo-card {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 16px;
    background: #111;
    cursor: pointer;
}

.photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.delete-btn {
    display: none;
    position: absolute;
    top: 7px;
    right: 7px;
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 50%;
    background: rgba(180,0,0,.9);
    color: white;
    font-size: 21px;
    z-index: 5;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 45px 10px;
    color: #666;
}


/* =========================
   FOTO BESAR
========================= */

#viewer {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
    background: rgba(0,0,0,.97);
}

#viewerImage {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 12px;
}

#closeViewer {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: #222;
    color: white;
    font-size: 28px;
}
</style>
</head>

<body>


<!-- LOGIN -->

<div id="loginPage">

    <div class="login-box">

        <div class="login-title">
            PRIVATE
        </div>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button
            class="login-btn"
            id="loginBtn">
            MASUK
        </button>

        <div id="loginStatus"></div>

    </div>

</div>


<!-- GALLERY -->

<div id="galleryPage">

    <div class="ml-title">
        M&L
    </div>

    <div class="ml-subtitle">
        PRIVATE GALLERY
    </div>


    <div class="topbar">

        <div class="gallery-title">
            📸 Gallery
        </div>

        <button
            class="logout"
            id="logoutBtn">
            Logout
        </button>

    </div>


    <!-- HANYA ADMIN -->

    <div id="adminPanel">

        <label
            class="file-label"
            for="fileInput">
            ＋ Tambahkan Foto
        </label>

        <input
            type="file"
            id="fileInput"
            accept="image/*"
        >

        <button
            class="upload-btn"
            id="uploadBtn">
            UPLOAD FOTO
        </button>

        <div id="uploadStatus"></div>

    </div>


    <div
        id="gallery"
        class="gallery">

        <div class="empty">
            Memuat foto...
        </div>

    </div>

</div>


<!-- VIEWER -->

<div id="viewer">

    <button id="closeViewer">
        ×
    </button>

    <img
        id="viewerImage"
        alt="Foto">

</div>


<script type="module">

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://vngbbgmmernxgdjzyizs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WmqF6NVq_f8IOGycOYO_CA_FaLrbXeS";

const BUCKET =
"Foto";


/* UID ADMIN */

const ADMIN_UID =
"68fb3fcd-dcf1-4176-8340-7f6fa8f90dce";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ELEMENT */

const loginPage =
document.getElementById("loginPage");

const galleryPage =
document.getElementById("galleryPage");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const loginStatus =
document.getElementById("loginStatus");

const adminPanel =
document.getElementById("adminPanel");

const gallery =
document.getElementById("gallery");

const fileInput =
document.getElementById("fileInput");

const uploadBtn =
document.getElementById("uploadBtn");

const uploadStatus =
document.getElementById("uploadStatus");

const viewer =
document.getElementById("viewer");

const viewerImage =
document.getElementById("viewerImage");

const closeViewer =
document.getElementById("closeViewer");


/* =========================
   CEK LOGIN
========================= */

async function checkLogin() {

    const {
        data
    } =
    await supabase.auth.getUser();


    if (!data.user) {

        loginPage.style.display =
        "flex";

        galleryPage.style.display =
        "none";

        adminPanel.style.display =
        "none";

        return;
    }


    loginPage.style.display =
    "none";

    galleryPage.style.display =
    "block";


    /* CEK ADMIN */

    if (
        data.user.id === ADMIN_UID
    ) {

        adminPanel.style.display =
        "block";

    } else {

        adminPanel.style.display =
        "none";

    }


    loadGallery(
        data.user.id === ADMIN_UID
    );
}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    async function() {

        loginStatus.textContent =
        "Memeriksa...";


        const {
            error
        } =
        await supabase.auth
        .signInWithPassword({

            email:
            email.value.trim(),

            password:
            password.value

        });


        if (error) {

            loginStatus.textContent =
            "Email atau password salah.";

            return;
        }


        loginStatus.textContent =
        "";

        email.value = "";

        password.value = "";

        checkLogin();

    }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async function() {

        await supabase.auth.signOut();

        checkLogin();

    }
);


/* =========================
   LOAD GALLERY
========================= */

async function loadGallery(
    isAdmin
) {

    gallery.innerHTML =
    '<div class="empty">Memuat foto...</div>';


    const {
        data,
        error
    } =
    await supabase
    .storage
    .from(BUCKET)
    .list("", {

        limit: 100,

        offset: 0,

        sortBy: {
            column: "created_at",
            order: "desc"
        }

    });


    if (error) {

        console.error(error);

        gallery.innerHTML =
        '<div class="empty">Gagal memuat foto.</div>';

        return;
    }


    gallery.innerHTML = "";


    if (!data || data.length === 0) {

        gallery.innerHTML =
        '<div class="empty">Belum ada foto.</div>';

        return;
    }


    data.forEach(
        function(file) {

            if (!file.name)
                return;


            const {
                data: publicData
            } =
            supabase
            .storage
            .from(BUCKET)
            .getPublicUrl(
                file.name
            );


            const imageURL =
            publicData.publicUrl;


            const card =
            document.createElement(
                "div"
            );

            card.className =
            "photo-card";


            const img =
            document.createElement(
                "img"
            );

            img.src =
            imageURL;

            img.alt =
            "Foto";


            card.appendChild(img);


            /* HANYA ADMIN */

            if (isAdmin) {

                const deleteBtn =
                document.createElement(
                    "button"
                );

                deleteBtn.className =
                "delete-btn";

                deleteBtn.style.display =
                "block";

                deleteBtn.innerHTML =
                "×";


                deleteBtn.addEventListener(
                    "click",
                    async function(event) {

                        event.stopPropagation();


                        if (
                            !confirm(
                                "Hapus foto ini?"
                            )
                        ) {
                            return;
                        }


                        const {
                            error
                        } =
                        await supabase
                        .storage
                        .from(BUCKET)
                        .remove([
                            file.name
                        ]);


                        if (error) {

                            alert(
                                "Gagal menghapus foto."
                            );

                            return;
                        }


                        loadGallery(
                            true
                        );

                    }
                );


                card.appendChild(
                    deleteBtn
                );

            }


            /* KLIK FOTO */

            card.addEventListener(
                "click",
                function() {

                    viewerImage.src =
                    imageURL;

                    viewer.style.display =
                    "flex";

                    document.body.style.overflow =
                    "hidden";

                }
            );


            gallery.appendChild(card);

        }
    );
}


/* =========================
   UPLOAD ADMIN
========================= */

uploadBtn.addEventListener(
    "click",
    async function() {

        const {
            data
        } =
        await supabase.auth.getUser();


        if (
            !data.user ||
            data.user.id !== ADMIN_UID
        ) {

            uploadStatus.textContent =
            "Akses ditolak.";

            return;
        }


        const file =
        fileInput.files[0];


        if (!file) {

            uploadStatus.textContent =
            "Pilih foto dulu.";

            return;
        }


        uploadStatus.textContent =
        "Mengupload...";


        const extension =
        file.name
        .split(".")
        .pop();


        const fileName =
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2,8) +
        "." +
        extension;


        const {
            error
        } =
        await supabase
        .storage
        .from(BUCKET)
        .upload(
            fileName,
            file,
            {
                cacheControl: "3600",
                upsert: false
            }
        );


        if (error) {

            console.error(error);

            uploadStatus.textContent =
            "Upload gagal.";

            return;
        }


        uploadStatus.textContent =
        "Foto berhasil ditambahkan.";

        fileInput.value = "";

        loadGallery(true);

    }
);


/* =========================
   VIEWER
========================= */

function closeImage() {

    viewer.style.display =
    "none";

    viewerImage.src = "";

    document.body.style.overflow =
    "";

}


closeViewer.addEventListener(
    "click",
    closeImage
);


viewer.addEventListener(
    "click",
    function(event) {

        if (
            event.target === viewer
        ) {

            closeImage();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeImage();

        }

    }
);


/* =========================
   AUTH
========================= */

supabase.auth.onAuthStateChange(
    function() {

        checkLogin();

    }
);


/* START */

checkLogin();

</script>

</body>
</html>
