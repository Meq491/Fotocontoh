<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M&L</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at top,
      #292929 0%,
      #090909 45%,
      #000 100%
    );
  color:#fff;
  font-family:Arial,sans-serif;
}


/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:370px;
  padding:28px 24px;
  background:#111;
  border:1px solid #292929;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.65);
}

.loginTitle{
  text-align:center;
  font-size:23px;
  font-weight:bold;
  letter-spacing:6px;
  margin-bottom:28px;
}

.loginBox input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border:1px solid #333;
  border-radius:11px;
  background:#050505;
  color:white;
  outline:none;
  font-size:15px;
}

.loginButton{
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-weight:bold;
  letter-spacing:2px;
  cursor:pointer;
}

#loginStatus{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-top:12px;
}


/* GALERI */

#galleryPage{
  display:none;
  width:92%;
  max-width:650px;
  margin:auto;
  padding:32px 0 60px;
}

.mlTitle{
  text-align:center;
  font-size:55px;
  font-weight:900;
  letter-spacing:8px;
}

.privateText{
  text-align:center;
  color:#777;
  font-size:10px;
  letter-spacing:5px;
  margin-top:4px;
}

.galleryName{
  text-align:center;
  margin:22px 0 25px;
  font-size:25px;
  font-weight:700;
}

.topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.galleryLabel{
  font-size:20px;
  font-weight:700;
}

.logoutButton{
  padding:9px 13px;
  border-radius:10px;
  border:1px solid #333;
  background:#111;
  color:#aaa;
  cursor:pointer;
}


/* ADMIN */

#adminPanel{
  display:none;
  background:#111;
  border:1px solid #292929;
  border-radius:17px;
  padding:16px;
  margin-bottom:22px;
}

.adminLabel{
  color:#aaa;
  font-size:13px;
  margin-bottom:7px;
}

#descriptionInput{
  width:100%;
  min-height:80px;
  padding:13px;
  margin-bottom:10px;
  border-radius:11px;
  border:1px solid #333;
  background:#050505;
  color:white;
  outline:none;
  resize:vertical;
  font-family:Arial,sans-serif;
}

.fileLabel{
  display:block;
  text-align:center;
  padding:13px;
  border:1px dashed #444;
  border-radius:11px;
  color:#aaa;
  margin-bottom:10px;
  cursor:pointer;
}

#fileInput{
  display:none;
}

.uploadButton{
  width:100%;
  padding:13px;
  border:0;
  border-radius:11px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

#uploadStatus{
  text-align:center;
  color:#aaa;
  font-size:12px;
  margin-top:9px;
}


/* FOTO */

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.photoItem{
  min-width:0;
}

.photoBox{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#111;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}

.photoBox img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photoDescription{
  margin-top:9px;
  padding:0 3px;
  font-size:15px;
  font-weight:600;
  line-height:1.4;
  color:#eee;
}


/* MENU */

.moreButton{
  position:absolute;
  top:8px;
  right:8px;
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:22px;
  z-index:5;
  cursor:pointer;
}

.photoMenu{
  position:absolute;
  top:48px;
  right:8px;
  display:none;
  min-width:110px;
  background:#181818;
  border:1px solid #333;
  border-radius:11px;
  overflow:hidden;
  z-index:20;
}

.photoMenu button{
  width:100%;
  padding:12px 15px;
  border:0;
  background:transparent;
  color:white;
  text-align:left;
  cursor:pointer;
}


/* KOSONG */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:45px 10px;
  color:#666;
}


/* VIEWER */

#viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.97);
}

#viewerImage{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
  border-radius:12px;
}

#closeViewer{
  position:absolute;
  right:15px;
  top:15px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:28px;
  cursor:pointer;
}


/* HP */

@media(max-width:430px){

  .mlTitle{
    font-size:49px;
  }

  .galleryName{
    font-size:22px;
  }

  .photoDescription{
    font-size:14px;
  }

}

</style>
</head>

<body>


<!-- LOGIN -->

<div id="loginPage">

  <div class="loginBox">

    <div class="loginTitle">
      PRIVATE
    </div>

    <input
      id="emailInput"
      type="email"
      placeholder="Email"
    >

    <input
      id="passwordInput"
      type="password"
      placeholder="Password"
    >

    <button
      id="loginButton"
      class="loginButton"
    >
      MASUK
    </button>

    <div id="loginStatus"></div>

  </div>

</div>


<!-- GALERI -->

<div id="galleryPage">

  <div class="mlTitle">
    M&L
  </div>

  <div class="privateText">
    PRIVATE GALLERY
  </div>

  <div
    id="galleryName"
    class="galleryName"
  >
    M&L
  </div>

  <div class="topBar">

    <div class="galleryLabel">
      Gallery
    </div>

    <button
      id="logoutButton"
      class="logoutButton"
    >
      Logout
    </button>

  </div>


  <!-- ADMIN -->

  <div id="adminPanel">

    <div class="adminLabel">
      Keterangan Foto
    </div>

    <textarea
      id="descriptionInput"
      placeholder="Tulis keterangan foto..."
    ></textarea>

    <label
      class="fileLabel"
      for="fileInput"
    >
      + PILIH FOTO
    </label>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
    >

    <button
      id="uploadButton"
      class="uploadButton"
    >
      UPLOAD FOTO
    </button>

    <div id="uploadStatus"></div>

  </div>


  <!-- GALERI FOTO -->

  <div
    id="gallery"
    class="gallery"
  >

    <div class="empty">
      Memuat foto...
    </div>

  </div>

</div>


<!-- VIEWER -->

<div id="viewer">

  <button id="closeViewer">
    ×
  </button>

  <img
    id="viewerImage"
    alt="Foto"
  >

</div>


<script type="module">
