<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEQ491 - Upload Foto</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

.container {
    width: 92%;
    max-width: 600px;
    margin: auto;
    padding: 35px 0 50px;
}

.logo {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 3px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-top: 8px;
}

.upload-box {
    margin-top: 30px;
    padding: 25px;
    background: #151515;
    border-radius: 20px;
    text-align: center;
}

input[type="file"] {
    display: none;
}

.pilih {
    display: inline-block;
    padding: 15px 25px;
    background: white;
    color: black;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

#preview {
    width: 100%;
    margin-top: 20px;
    border-radius: 15px;
    display: none;
}

#uploadBtn {
    display: none;
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #00c853;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

#uploadBtn:disabled {
    opacity: 0.6;
}

#status {
    margin-top: 15px;
    color: #aaa;
}

h2 {
    margin-top: 35px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        MEQ491
    </div>

    <div class="subtitle">
        Upload Foto
    </div>

    <div class="upload-box">

        <label for="fotoInput" class="pilih">
            📷 Pilih Foto
        </label>

        <input
            type="file"
            id="fotoInput"
            accept="image/*"
        >

        <img id="preview">

        <button id="uploadBtn">
            ⬆️ Upload Foto
        </button>

        <div id="status">
            Belum ada foto dipilih
        </div>

    </div>

    <h2>
        📸 Galeri MEQ491
    </h2>

    <div id="gallery" class="gallery"></div>

</div>

<script>

/* ==========================================
   SUPABASE
   ========================================== */

const SUPABASE_URL =
"https://vngbbgmmernxgdjzyizs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WmqF6NVq_f8IOGycOYO_CA_FaLrbXeS";

const BUCKET =
"Foto";


/* ==========================================
   ELEMENT
   ========================================== */

const fotoInput =
document.getElementById("fotoInput");

const preview =
document.getElementById("preview");

const uploadBtn =
document.getElementById("uploadBtn");

const status =
document.getElementById("status");

const gallery =
document.getElementById("gallery");

let fileYangDipilih = null;


/* ==========================================
   PILIH FOTO
   ========================================== */

fotoInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {

        status.textContent =
        "❌ File harus berupa foto.";

        return;
    }

    fileYangDipilih = file;

    const reader = new FileReader();

    reader.onload = function(e) {

        preview.src = e.target.result;

        preview.style.display = "block";

        uploadBtn.style.display = "block";

        status.textContent =
        "Foto siap di-upload.";

    };

    reader.readAsDataURL(file);

});


/* ==========================================
   UPLOAD FOTO
   ========================================== */

uploadBtn.addEventListener("click", async function() {

    if (!fileYangDipilih) {

        status.textContent =
        "❌ Pilih foto terlebih dahulu.";

        return;
    }

    uploadBtn.disabled = true;

    status.textContent =
    "⏳ Sedang meng-upload foto...";


    try {

        const namaFile =
        Date.now() +
        "-" +
        Math.random().toString(36).substring(2) +
        "-" +
        fileYangDipilih.name
        .replace(/\s+/g, "-");


        const url =
        SUPABASE_URL +
        "/storage/v1/object/" +
        BUCKET +
        "/" +
        namaFile;


        const response =
        await fetch(url, {

            method: "POST",

            headers: {

                "apikey":
                SUPABASE_KEY,

                "Authorization":
                "Bearer " +
                SUPABASE_KEY,

                "Content-Type":
                fileYangDipilih.type,

                "x-upsert":
                "false"

            },

            body:
            fileYangDipilih

        });


        if (!response.ok) {

            const error =
            await response.text();

            console.log(error);

            throw new Error(error);

        }


        status.textContent =
        "✅ Foto berhasil disimpan online!";


        preview.style.display =
        "none";

        uploadBtn.style.display =
        "none";

        fotoInput.value =
        "";

        fileYangDipilih =
        null;


        loadGallery();

    }

    catch(error) {

        console.error(error);

        status.textContent =
        "❌ Upload gagal. Cek Policies Supabase.";

    }


    uploadBtn.disabled =
    false;

});


/* ==========================================
   GALERI
   ========================================== */

async function loadGallery() {

    try {

        const response =
        await fetch(

            SUPABASE_URL +
            "/storage/v1/object/list/" +
            BUCKET,

            {

                method: "POST",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                    "Content-Type":
                    "application/json"

                },

                body: JSON.stringify({

                    limit: 100,

                    offset: 0,

                    sortBy: {

                        column:
                        "created_at",

                        order:
                        "desc"

                    }

                })

            }

        );


        if (!response.ok) {

            throw new Error(
                "Gagal mengambil galeri"
            );

        }


        const files =
        await response.json();


        gallery.innerHTML = "";


        files.forEach(function(file) {

            if (!file.name) {
                return;
            }


            const imageURL =
            SUPABASE_URL +
            "/storage/v1/object/public/" +
            BUCKET +
            "/" +
            encodeURIComponent(
                file.name
            );


            const img =
            document.createElement("img");


            img.src =
            imageURL;


            img.loading =
            "lazy";


            gallery.appendChild(img);

        });


    }

    catch(error) {

        console.error(error);

        gallery.innerHTML =
        "<p>Galeri belum bisa dimuat.</p>";

    }

}


/* ==========================================
   JALANKAN GALERI
   ========================================== */

loadGallery();

</script>

</body>
</html>
